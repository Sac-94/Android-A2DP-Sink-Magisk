name: Build Magisk module
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: sh ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: A2DP-Sink-Android15-Magisk
          path: release/A2DP-Sink-Android15-Magisk.zip
